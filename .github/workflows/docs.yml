# Builds the Doxygen API documentation (docs/api/html) on each push to
# github-main (or by hand), and keeps it as the run's github-pages artifact.
# Fails if doxygen warns about our code. Publishing it to GitHub Pages is
# skipped unless the repository variable PAGES_ENABLED is "true" (Settings >
# Secrets and variables > Actions > Variables), with Pages set to "GitHub
# Actions" in Settings > Pages.
name: docs
on:
  push:
    branches: [github-main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Doxygen
        run: |
          doxygen Doxyfile
          if [ -s docs/api/warnings.txt ]; then cat docs/api/warnings.txt; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/html
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
